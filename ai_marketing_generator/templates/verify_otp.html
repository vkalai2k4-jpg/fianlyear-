{% extends 'base.html' %}
{% block title %}Verify OTP{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <h3 class="mb-2">Enter verification code</h3>
            <p class="text-muted small">A 6-digit code was sent to <b>{{ contact }}</b>. It's valid for 10 minutes.</p>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">OTP Code</label>
                    <input type="text" name="otp" class="form-control" maxlength="6" placeholder="123456" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Verify</button>
            </form>
            <p class="mt-3 text-center small">
                Didn't get it?
                {% if target == 'user' %}
                    <a href="{{ url_for('resend_user_otp', user_id=target_id) }}">Resend code</a>
                {% else %}
                    <a href="{{ url_for('resend_customer_otp', customer_id=target_id) }}">Resend code</a>
                {% endif %}
            </p>
        </div>
    </div>
</div>
{% endblock %}
